[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "proc-rosetta"
version = "0.1.0"
description = "Multimodal process-mining embeddings with PyTorch and pm4py"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "proc-rosetta contributors" }]
dependencies = [
  "altair>=5.0",
  "gensim>=4.4",
  "graphviz>=0.20",
  "numpy>=1.24",
  "pandas>=2.0",
  "pm4py>=2.7",
  "streamlit>=1.40",
  "torch>=2.0",
  "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
proc-rosetta = "proc_rosetta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proc_rosetta", "proc_rosetta_ui"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
