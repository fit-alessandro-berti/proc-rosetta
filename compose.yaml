name: proc-rosetta

services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHECKPOINT_URL: ${PROC_ROSETTA_CHECKPOINT_URL:-https://www.alessandroberti.it/checkpoint_rosetta_latest.tar.gz}
        CHECKPOINT_SHA256: ${PROC_ROSETTA_CHECKPOINT_SHA256:-}
    image: proc-rosetta-streamlit:local
    restart: unless-stopped
    init: true
    environment:
      PROC_ROSETTA_CHECKPOINT_DIR: /checkpoints
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "50"
    expose:
      - "8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      streamlit:
        condition: service_healthy
    ports:
      - "${PROC_ROSETTA_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./docker/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
